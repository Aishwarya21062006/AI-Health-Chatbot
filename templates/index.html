<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Menu Bar -->
    <nav class="navbar">
        <div class="logo">HealthAI</div>
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">&#9776;</label>
        <ul class="menu">
            <li><a href="#">Profile</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Sign Out</a></li>
        </ul>
    </nav>

    <!-- Login Page -->
    <section class="login-section">
        <div class="login-container">
            <h2>Login to HealthAI</h2>
            <form method="POST" action="/login">
                <input type="text" name="email_or_mobile" placeholder="Email or Mobile Number" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </section>

    <!-- Chatbot Section -->
    <section class="chat-section">
        <div class="chat-container">
            <div class="chat-header">
                <h3>AI Health Assistant</h3>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Chat messages will appear here dynamically -->
            </div>
            <form class="chat-input" id="chat-form">
                <input type="text" id="user-message" placeholder="Type your message..." required>
                <button type="submit">Send</button>
            </form>
        </div>
    </section>

</body>
</html>
